[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-picture-frame"
version = "0.3.0"
description = "Digital picture frame software for Raspberry Pi (Immich backend)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0.0",
  "Pillow>=10.4.0",
  "pygame>=2.6.0",
  "tomli-w>=1.0.0",
  "waitress>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
]

[project.scripts]
picture-frame-sync = "picture_frame.cli:run_sync"
picture-frame-display = "picture_frame.cli:run_display"
picture-frame-web = "picture_frame.cli:run_web"
picture-frame-headless = "picture_frame.cli:run_headless"
picture-frame-app = "picture_frame.cli:run_app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
picture_frame = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
